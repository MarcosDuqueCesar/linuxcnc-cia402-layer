# --------------------------------------------------
# Example LinuxCNC INI for framework integration
# User-specific example only.
# This file is NOT required by the framework itself.
# Adjust paths, machine name, kinematics, GUI, and runtime settings
# to match your own LinuxCNC environment.
# --------------------------------------------------

[EMC]
MACHINE = cia402_framework_example
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1.2
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC =
INTRO_TIME = 0
EDITOR = xdg-open
PYVCP =

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code File

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = ~/linuxcnc/nc_files
USER_M_PATH = ~/linuxcnc/nc_files

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = <user-selected-hal>
POSTGUI_HALFILE =

[HALUI]
HALUI = halui

[TRAJ]
COORDINATES = X
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 50.0

[KINS]
KINEMATICS = trivkins coordinates=X
JOINTS = 1

[AXIS_X]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 300.0
MIN_LIMIT = -1000.0
MAX_LIMIT = 1000.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -1000.0
MAX_LIMIT = 1000.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 300.0
STEPGEN_MAXACCEL = 450.0
SCALE = 1000.0
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_FINAL_VEL = 0.0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE =
